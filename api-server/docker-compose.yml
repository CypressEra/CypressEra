version: '3.8'

services:
  # API Server
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      # Google OAuth configuration
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
    volumes:
      - ./data:/app/data
      - ../flow-solver/target/release/flow-solver:/app/flow-solver:ro
    depends_on:
      - flow-solver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Flow Solver (build and run)
  flow-solver:
    build:
      context: ../flow-solver
      dockerfile: Dockerfile
    volumes:
      - ../flow-solver:/app
      - flow-solver-cache:/usr/local/cargo/registry
      - flow-solver-target:/app/target
    working_dir: /app
    command: ["cargo", "build", "--release"]
    profiles:
      - build

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-server
    restart: unless-stopped
    profiles:
      - production

volumes:
  flow-solver-cache:
  flow-solver-target: 