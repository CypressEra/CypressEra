version: '3.8'

services:
  react-ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8080}
      - MCP_BASE_URL=${MCP_BASE_URL:-http://localhost:3001}
    restart: unless-stopped
    networks:
      - x-flow-network

networks:
  x-flow-network:
    driver: bridge

