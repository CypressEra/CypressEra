# Development stack: builds all services from source.
#
# Prerequisites:
#   1. ./scripts/get-solver.sh        (fetches the flow-solver binary)
#   2. cp product-deploy/.env.template .env   and set the two required keys
#
# For production deployment (prebuilt images, HTTPS), use product-deploy/.
services:
  react-ui:
    build:
      context: ./react-ui
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      # These are injected into the HTML and used by the *browser*,
      # so they must be reachable from your host machine.
      - API_BASE_URL=${PUBLIC_API_BASE_URL:-http://localhost:8080}
      - AGENT_BASE_URL=${PUBLIC_AGENT_BASE_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - api-server
      - agent-server

  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - GIN_MODE=release
      # password (default): JWT login backed by postgres.
      # none: no login, synthetic single user, database never touched.
      - AUTH_MODE=${AUTH_MODE:-password}
      # Mailgun configuration for email verification. Unset = registration
      # auto-verifies new accounts (no verification emails).
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_FROM=${MAILGUN_FROM:-}
      # Frontend base URL used in verification redirect links
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://react-ui:3000}
      # Database connection URL for user authentication
      - DATABASE_URL=${DATABASE_URL:-postgres://xflow:xflow_password@postgres:5432/xflow?sslmode=disable}
      # Shared JWT secret for issuing and verifying access tokens
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-change-this-secret-in-prod}
      - AUTH_ADMIN_EMAIL=${AUTH_ADMIN_EMAIL:-admin@example.com}
      - AUTH_ADMIN_PASSWORD=${AUTH_ADMIN_PASSWORD:-ChangeMe123!}
      - AUTH_REFRESH_ENABLED=${AUTH_REFRESH_ENABLED:-true}
      # Google OAuth configuration (unset = Google sign-in hidden)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Service Authentication (for Agent-Server to API-Server communication)
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET:-change-this-service-secret-in-prod}
      - STORAGE_BASE_PATH=/user-data
      - SOLVER_PATH=/flow-solver/target/release/flow-solver
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      # flow-solver binary fetched by scripts/get-solver.sh
      - ./flow-solver/target/release/flow-solver:/flow-solver/target/release/flow-solver:ro
      # Shared user data (model, sessions, results)
      - ./user-data:/user-data
      - ./api-server/logs:/app/logs
    restart: unless-stopped
    depends_on:
      - postgres

  agent-server:
    build:
      context: ./agent-server
      dockerfile: Dockerfile
      args:
        - VERSION=1.0.0
        - BUILD_TIME=${BUILD_TIME:-unknown}
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - APP_ENV=production
      # Chat model: any OpenAI-compatible endpoint
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6-luna}
      # Embedding model (RAG)
      - KB_EMBEDDING_MODEL=${KB_EMBEDDING_MODEL:-text-embedding-3-small}
      - KB_EMBEDDING_API_KEY=${KB_EMBEDDING_API_KEY}
      - KB_EMBEDDING_BASE_URL=${KB_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      # Knowledge base
      - KB_BASE_PATH=/user-data/knowledge
      - KB_ENABLE_FILE_WATCHER=true
      - KB_CHUNK_SIZE=${KB_CHUNK_SIZE:-800}
      - KB_CHUNK_OVERLAP=${KB_CHUNK_OVERLAP:-150}
      - KB_TOP_K=${KB_TOP_K:-3}
      # Server
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_DIR=/app/logs
      - ENABLE_REQUEST_LOGGING=true
      # Same JWT secret as api-server so tokens validate consistently
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-change-this-secret-in-prod}
      - SERVICE_AUTH_ENABLED=${SERVICE_AUTH_ENABLED:-true}
      - SERVICE_AUTH_SECRET=${SERVICE_AUTH_SECRET:-change-this-service-secret-in-prod}
      - API_SERVER_URL=http://api-server:8080
      # Brain module
      - ENABLE_BRAIN=${ENABLE_BRAIN:-true}
      - BRAIN_MAX_ROUNDS=${BRAIN_MAX_ROUNDS:-50}
      - BRAIN_MAX_TOKENS=${BRAIN_MAX_TOKENS:-100000}
    volumes:
      - ./user-data:/user-data
      - ./agent-server/logs:/app/logs
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-xflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-xflow_password}
      - POSTGRES_DB=${POSTGRES_DB:-xflow}
    volumes:
      - ./user-data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
